# Weekly grouped updates for Python deps (pyproject.toml) and GitHub Actions.
# Submodules (QuantLib, XAD, QuantLibAAD, pybind11) are bumped manually: XAD and
# pybind11 must match the xad package exactly.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # pinned to the XAD in lib/xad
      - dependency-name: "xad"
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
